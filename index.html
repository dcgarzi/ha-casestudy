const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const KEYNAME = "cs-key:" + P.salt;

// Media is encrypted too: decrypt each a/*.bin as it nears the viewport.
function decryptMedia(key) {
  const cache = new Map();
  const blobFor = ref => {
    if (!cache.has(ref)) cache.set(ref, (async () => {
      const [path, type] = ref.slice(ref.indexOf("enc:") + 4).split("|");
      const buf = new Uint8Array(await (await fetch(path)).arrayBuffer());
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
      return URL.createObjectURL(new Blob([pt], { type }));
    })());
    return cache.get(ref);
  };
  const SEL = '[src*="enc:"],[poster*="enc:"]';
  const swap = async el => {
    for (const at of ["poster", "src"]) {
      const v = el.getAttribute(at);
      if (v && v.includes("enc:")) { try { el.setAttribute(at, await blobFor(v)); } catch (e) {} }
    }
    if (el.tagName === "VIDEO") { el.load(); if (el.autoplay) el.play().catch(() => {}); }
  };
  const io = "IntersectionObserver" in window
    ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); swap(e.target); } }), { rootMargin: "1200px 0px" })
    : { observe: swap };
  const scan = root => { if (root.matches && root.matches(SEL)) io.observe(root); root.querySelectorAll && root.querySelectorAll(SEL).forEach(el => io.observe(el)); };
  scan(document);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && scan(n))))
    .observe(document.documentElement, { childList: true, subtree: true });
}

async function open(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(P.iv) }, key, dec(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
  decryptMedia(key);
}
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: dec(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

// Stay unlocked for the rest of this browser tab session
(async () => {
  try {
    const saved = sessionStorage.getItem(KEYNAME);
    if (saved) {
      const key = await crypto.subtle.importKey("raw", dec(saved), "AES-GCM", true, ["decrypt"]);
      await open(key);
    }
  } catch (e) { try { sessionStorage.removeItem(KEYNAME); } catch (_) {} }
})();

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "Checking…";
  try {
    const key = await keyFromPassword(document.getElementById("pw").value);
    const raw = await crypto.subtle.exportKey("raw", key);
    await open(key);
    try { sessionStorage.setItem(KEYNAME, enc(raw)); } catch (_) {}
  } catch (x) {
    err.textContent = "That password didn't work.";
    btn.disabled = false;
  }
});
</script>
